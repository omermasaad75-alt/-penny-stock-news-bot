name: المسح اليومي (Daily Scan)

# تشغيل تلقائي ٣ مرات كل يوم عمل + يدوياً عند الحاجة.
# المواعيد بتوقيت UTC (الرياض = UTC+3):
#   13:35 UTC = 16:35 الرياض — افتتاح السوق الأمريكي
#   17:05 UTC = 20:05 الرياض — منتصف الجلسة
#   21:15 UTC = 00:15 الرياض — بعد الإغلاق (بيانات إغلاق مستقرة)
on:
  schedule:
    - cron: "35 13 * * 1-5"
    - cron: "5 17 * * 1-5"
    - cron: "15 21 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "عدد الرموز في المسح"
        default: "40"
        required: false
      mode:
        description: "وضع البيانات: live (افتراضي) | demo (اختبار محلي فقط)"
        default: "live"
        required: false
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/**"
      - "tools/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/daily-scan.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scan-pages
  cancel-in-progress: false

jobs:
  scan:
    name: مسح السوق وبناء اللوحة
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: اختبارات سريعة (سلامة الكود)
        run: python -m pytest -q

      - name: المسح اليومي + بناء الموقع
        env:
          RSS_DATA_MODE: ${{ inputs.mode || 'live' }}
        run: |
          python tools/daily_scan.py --site site --limit ${{ inputs.limit || '40' }} --mode "${RSS_DATA_MODE}"

      - name: ✅ تحقق صرامة البيانات (لا تجريبي في النشر)
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("site/data/latest.json", encoding="utf-8"))
          mode = d.get("mode")
          rows = d.get("rows") or []
          synth = sum(1 for r in rows if r.get("synthetic"))
          no_source = [r["symbol"] for r in rows if not r.get("price_source") and r.get("last_close",0)>0]
          required = ("price_source","split_source","fundamentals_source","news_source")
          missing_cols = [c for c in required if c not in (rows[0].keys() if rows else [])]
          errors = []
          if mode != "live":
              errors.append(f"mode_effective = {mode!r} (يجب أن يكون 'live')")
          if synth > 0:
              errors.append(f"synthetic rows = {synth} (يجب أن يكون 0)")
          if no_source:
              errors.append(f"رموز بلا مصدر سعر: {no_source[:5]}")
          if missing_cols:
              errors.append(f"أعمدة مصادر مفقودة: {missing_cols}")
          if errors:
              print("✖ فشل التحقق:")
              for e in errors: print(" -", e)
              sys.exit(1)
          print(f"✔ التحقق ناجح: mode={mode}, total_rows={len(rows)}, synthetic={synth}, كل المصادر موجودة")
          PY

      - name: أرشيف النتائج (CSV/JSON/التقارير)
        uses: actions/upload-artifact@v4
        with:
          name: scan-run-${{ github.run_number }}
          path: |
            site/data
            site/reports
            site/history
          retention-days: 30
          if-no-files-found: warn

      - name: أرشيف الموقع كاملاً (للنشر والتنزيل)
        uses: actions/upload-artifact@v4
        with:
          name: site-publish-${{ github.run_number }}
          path: site
          retention-days: 7
          if-no-files-found: error

      - name: مؤشر الحالة في المستودع (docs/status)
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          d = json.load(open("site/data/latest.json", encoding="utf-8"))
          out = pathlib.Path("docs/status"); out.mkdir(parents=True, exist_ok=True)
          slim = {
              "generated_at_riyadh": d["generated_at_riyadh"],
              "mode": d["mode"],
              "summary": d["summary"],
              "top": [{k: r.get(k) for k in ("symbol", "phase", "score", "grade", "last_close",
                                              "lifecycle_ready", "lifecycle_failed",
                                              "resistance_distance_pct", "impulse_pct")}
                      for r in d["rows"][:12]],
              "providers": [{k: p.get(k) for k in ("name", "ok", "source_kind", "detail")}
                            for p in d["sources"]["providers"]],
              "run_url": f"{__import__('os').environ.get('GITHUB_SERVER_URL','https://github.com')}/"
                         f"{__import__('os').environ.get('GITHUB_REPOSITORY','')}/actions/runs/"
                         f"{__import__('os').environ.get('GITHUB_RUN_ID','')}",
          }
          (out / "latest.json").write_text(json.dumps(slim, ensure_ascii=False, indent=1), encoding="utf-8")
          print("docs/status/latest.json:", d["generated_at_riyadh"], "|", d["mode"],
                "|", d["summary"]["scanned"], "رمز")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status
          git diff --cached --quiet || git commit -qm "chore(status): تحديث آخر مسح — $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
          git push -q || echo "تعذّر رفع مؤشر الحالة (سيُحدَّث في المسح القادم)"

      - name: ملخّص في صفحة العملية
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("site/data/latest.json", encoding="utf-8"))
          s = d["summary"]
          print("### ملخّص المسح —", d["generated_at_riyadh"], "(" + d["mode"] + ")")
          print()
          print("| رموز مفحوصة | تقسيم عكسي | مؤهلة | متابعة | جاهز فنياً | متوسط التقييم |")
          print("|---|---|---|---|---|---|")
          print(f"| {s['scanned']} | {s['with_reverse_split']} | {s['eligible']} | {s['watchlist']} | {s['ready']} | {s['avg_score_watchlist']} |")
          print()
          print("**أفضل الفرص:**", " · ".join(f"{r['symbol']} ({r['score']} {r['grade']})" for r in d["rows"][:8]) or "—")
          print()
          print("**الرابط الثابت للجوال:** https://omermasaad75-alt.github.io/-penny-stock-news-bot/")
          PY

      - name: تجهيز ملفات النشر (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: نشر اللوحة (gh-pages + GitHub Pages)
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: تنزيل الموقع المبني
        uses: actions/download-artifact@v4
        with:
          name: site-publish-${{ github.run_number }}
          path: site

      # النشر على فرع gh-pages: GitHub يكتشف الفرع وينشر الموقع تلقائياً (بلا أي إعداد يدوي).
      - name: النشر على فرع gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "نشر اللوحة — $(date -u '+%Y-%m-%d %H:%M') UTC"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -fq origin gh-pages
          echo "✔ تم تحديث فرع gh-pages"

      - name: فحص حالة GitHub Pages
        id: pages
        run: |
          curl -s -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -o /tmp/pages.json -w '%{http_code}' > /tmp/pages.code || true
          echo "http=$(cat /tmp/pages.code 2>/dev/null || echo 000)" >> "$GITHUB_OUTPUT"
          BUILD=$(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('build_type',''))" 2>/dev/null || echo "")
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "حالة Pages: $(cat /tmp/pages.code) | نوع البناء: ${BUILD:-غير معروف}"
          if [ "$(cat /tmp/pages.code)" != "200" ]; then
            echo "::warning title=رابط الجوال::لم تُفعَّل Pages للمستودع بعد. التفعيل من: Settings → Pages → Build and deployment → Source = Deploy from a branch → gh-pages / (root) ثم Save. الموقع منشور أصلاً على الفرع gh-pages."
          fi

      - name: النشر عبر GitHub Actions (يُستخدم فقط إن كان مصدر Pages هو Actions)
        id: deployment
        if: steps.pages.outputs.build == 'workflow'
        uses: actions/deploy-pages@v4
