name: Run Penny Stock Bot

on:
  workflow_dispatch: # يتيح لك زر تشغيل يدوي Run workflow
  schedule:
    - cron: '0 * * * *' # يعمل تلقائياً كل ساعة (يمكنك تعديلها)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bot
        run: |
          python main.py
