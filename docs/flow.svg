<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" font-family="Segoe UI, Tahoma, Arial, sans-serif" direction="rtl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#131a24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#388bfd"/>
    </marker>
  </defs>

  <rect width="1180" height="620" fill="url(#bg)" rx="16"/>
  <text x="1140" y="44" fill="#e6edf3" font-size="24" font-weight="700" text-anchor="end">تسلسل استراتيجية التقسيم العكسي والانعكاس</text>
  <text x="1140" y="70" fill="#8b96a5" font-size="14" text-anchor="end">Reverse-Split Oversold Reversal — RS Reversal Terminal</text>

  <g>
    <!-- المرحلة 1 -->
    <rect x="930" y="100" width="220" height="86" rx="12" fill="#0f2136" stroke="#2f6fbf"/>
    <text x="1136" y="130" fill="#8ec8ff" font-size="15" font-weight="700" text-anchor="end">1) تقسيم عكسي مرصود</text>
    <text x="1136" y="152" fill="#c9d1d9" font-size="12.5" text-anchor="end">نسبة 1:2 حتى 1:60</text>
    <text x="1136" y="172" fill="#c9d1d9" font-size="12.5" text-anchor="end">خلال آخر 60 يوماً</text>

    <!-- المرحلة 2 -->
    <rect x="680" y="100" width="220" height="86" rx="12" fill="#221a08" stroke="#5c4708"/>
    <text x="886" y="130" fill="#e3b341" font-size="15" font-weight="700" text-anchor="end">2) هبوط قوي وتشبع بيعي</text>
    <text x="886" y="152" fill="#c9d1d9" font-size="12.5" text-anchor="end">صعود التقسيم ≥ 5%</text>
    <text x="886" y="172" fill="#c9d1d9" font-size="12.5" text-anchor="end">هبوط ≥ 30% · RSI &lt; 30</text>

    <!-- المرحلة 3 -->
    <rect x="430" y="100" width="220" height="86" rx="12" fill="#221a08" stroke="#d29922"/>
    <text x="636" y="130" fill="#f0c674" font-size="15" font-weight="700" text-anchor="end">3) قاع يتشكّل</text>
    <text x="636" y="152" fill="#c9d1d9" font-size="12.5" text-anchor="end">بيع استسلامي على حجم مرتفع</text>
    <text x="636" y="172" fill="#c9d1d9" font-size="12.5" text-anchor="end">ثبات أقل من 3 جلسات</text>

    <!-- المرحلة 4 -->
    <rect x="180" y="100" width="220" height="86" rx="12" fill="#0e2a18" stroke="#1c5a30"/>
    <text x="386" y="130" fill="#7ee787" font-size="15" font-weight="700" text-anchor="end">4) ثبات على القاع</text>
    <text x="386" y="152" fill="#c9d1d9" font-size="12.5" text-anchor="end">3-5 جلسات داخل ±9%</text>
    <text x="386" y="172" fill="#c9d1d9" font-size="12.5" text-anchor="end">جفاف حجم &lt; 90% → قائمة المتابعة</text>

    <!-- المرحلة 5 -->
    <rect x="680" y="250" width="220" height="86" rx="12" fill="#0e2a18" stroke="#2ea043"/>
    <text x="886" y="280" fill="#7ee787" font-size="15" font-weight="700" text-anchor="end">5) المرحلة الإيجابية</text>
    <text x="886" y="302" fill="#c9d1d9" font-size="12.5" text-anchor="end">RSI يتحسّن وخرج من التشبع</text>
    <text x="886" y="322" fill="#c9d1d9" font-size="12.5" text-anchor="end">إغلاق فوق EMA9 · MACD يتحسّن</text>

    <!-- المرحلة 6 -->
    <rect x="430" y="250" width="220" height="86" rx="12" fill="#0e2a18" stroke="#1f9a4d"/>
    <text x="636" y="280" fill="#7ee787" font-size="15" font-weight="700" text-anchor="end">6) انعكاس مؤكد (جاهز فنياً)</text>
    <text x="636" y="302" fill="#c9d1d9" font-size="12.5" text-anchor="end">اختراق القناة الهابطة</text>
    <text x="636" y="322" fill="#c9d1d9" font-size="12.5" text-anchor="end">حجم نسبي ≥ 1.5x + قيعان صاعدة</text>

    <!-- المرحلة 7 -->
    <rect x="180" y="250" width="220" height="86" rx="12" fill="#1b1330" stroke="#8957e5"/>
    <text x="386" y="280" fill="#c9a6ff" font-size="15" font-weight="700" text-anchor="end">7) تمدد بعد الاختراق</text>
    <text x="386" y="302" fill="#c9d1d9" font-size="12.5" text-anchor="end">+45% فوق القاع → لا مطاردة</text>
    <text x="386" y="322" fill="#c9d1d9" font-size="12.5" text-anchor="end">انتظار إعادة اختبار القاعدة</text>
  </g>

  <!-- الأسهم -->
  <g stroke="#388bfd" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M928 143 L906 143"/>
    <path d="M678 143 L656 143"/>
    <path d="M428 143 L406 143"/>
    <path d="M290 190 C290 235 480 240 676 292" />
    <path d="M676 293 L654 293"/>
    <path d="M428 293 L406 293"/>
  </g>

  <!-- لوحة الخطة -->
  <g>
    <rect x="600" y="400" width="550" height="180" rx="14" fill="#151a22" stroke="#242c38"/>
    <text x="1132" y="432" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="end">خطة التداول المولّدة آلياً</text>
    <text x="1132" y="462" fill="#c9d1d9" font-size="13" text-anchor="end">• نقطة الاختراق: أعلى سقف القاعدة + 1.2% (مقيّدة ≤ +25%)</text>
    <text x="1132" y="486" fill="#c9d1d9" font-size="13" text-anchor="end">• الوقف التداولي: 1.4×ATR (8%-20%) — ووقف إلغاء السيناريو تحت القاع</text>
    <text x="1132" y="510" fill="#c9d1d9" font-size="13" text-anchor="end">• الأهداف: 38.2% / 61.8% / 100% من ارتداد الموجة الهابطة</text>
    <text x="1132" y="534" fill="#c9d1d9" font-size="13" text-anchor="end">• مخاطرة/عائد محسوبة + حجم مركز 0.5%-1% مخاطرة/صفقة</text>
    <text x="1132" y="560" fill="#f85149" font-size="13" text-anchor="end">• أي كسر للقاع -3% = إلغاء السيناريو فوراً</text>
  </g>

  <!-- لوحة البيانات -->
  <g>
    <rect x="30" y="400" width="540" height="180" rx="14" fill="#151a22" stroke="#242c38"/>
    <text x="546" y="432" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="end">البيانات المرصودة لكل سهم</text>
    <text x="546" y="462" fill="#c9d1d9" font-size="13" text-anchor="end">• الأسعار: يومي + 4 ساعات · التقسيمات · ATR · RVOL</text>
    <text x="546" y="486" fill="#c9d1d9" font-size="13" text-anchor="end">• الأساسيات: عدد الأسهم · الفلوت · القيمة السوقية</text>
    <text x="546" y="510" fill="#c9d1d9" font-size="13" text-anchor="end">• البيع المكشوف: % من الفلوت · أيام التغطية · حجم البيع اليومي</text>
    <text x="546" y="534" fill="#c9d1d9" font-size="13" text-anchor="end">• الأخبار: إيجابي/سلبي/محايد + المحفزات المستقبلية</text>
    <text x="546" y="560" fill="#f0c674" font-size="13" text-anchor="end">• إفصاحات التخفيف: 424B5 / S-1 / S-3 / مذكرات شراء</text>
  </g>

  <text x="30" y="600" fill="#6b7684" font-size="12">RS Reversal Terminal — تحليل فني/كمّي وليس نصيحة استثمارية</text>
</svg>
